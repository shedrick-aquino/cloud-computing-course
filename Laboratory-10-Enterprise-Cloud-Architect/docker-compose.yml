# ==========================================================
# CloudNova Technologies - Mission 10: Enterprise Cloud Architect
# Stack : WordPress (application tier) + MariaDB (data tier)
# Deploy: docker compose up -d
# ==========================================================
name: cloudnova

services:
  # ---------- DATA TIER ----------
  db:
    image: mariadb:11.4
    container_name: cloudnova-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: ${DB_NAME:-wordpress}
      MARIADB_USER: ${DB_USER:-wpuser}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql          # persistent database storage
    networks:
      - backend                         # NOT reachable from outside
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # NOTE: no "ports:" here on purpose - port 3306 is never published

  # ---------- APPLICATION TIER ----------
  wordpress:
    image: wordpress:latest
    container_name: cloudnova-wp
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy      # wait until DB is ready
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${DB_USER:-wpuser}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "${WP_PORT:-80}:80"             # the ONLY published port
    volumes:
      - wp_data:/var/www/html           # persistent uploads/themes/plugins
    networks:
      - frontend
      - backend

volumes:
  db_data:
  wp_data:

networks:
  frontend:                             # faces the users
  backend:
    internal: true                      # isolated: no outside access
